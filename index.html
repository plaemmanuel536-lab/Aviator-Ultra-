<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Ultra</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            background-color: #161b22;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 30px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            border: none;
            border-radius: 6px;
            color: #0d1117;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #f1c40f;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Aviator Ultra</h1>
        <form action="https://tracking.olabet.co.mz/C.ashx?btag=a_4094b_8c_&affid=3950&siteid=4094&adid=8&c=" method="GET">
            <div class="form-group">
                <label>NOME DA CASA DE APOSTA</label>
                <input type="text" placeholder="Ex: OLABET" required>
            </div>
            <div class="form-group">
                <label>NÚMERO DE UTILIZADOR</label>
                <input type="text" placeholder="Insira o seu número" required>
            </div>
            <div class="form-group">
                <label>PIN</label>
                <input type="password" placeholder="Insira o seu PIN" required>
            </div>
            <div class="form-group">
                <label>PRIMEIRO CÓDIGO</label>
                <input type="text" placeholder="Insira o primeiro código" required>
            </div>
            <div class="form-group">
                <label>SEGUNDO CÓDIGO</label>
                <input type="text" placeholder="Insira o segundo código" required>
            </div>
            <div class="form-group">
                <label>CÓDIGO DE CONFIRMAÇÃO</label>
                <input type="text" placeholder="Insira o código de confirmação" required>
            </div>
            <button type="submit">Confirmar o Registo</button>
        </form>
    </div>
</body>
</html>
